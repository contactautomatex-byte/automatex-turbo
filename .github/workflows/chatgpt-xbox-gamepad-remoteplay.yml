name: Build Xbox Controle Game APK

on:
  push:
    branches:
      - chatgpt/xbox-remote-apk
    paths:
      - '.github/workflows/chatgpt-xbox-gamepad-remoteplay.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;23.1.7779620'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Clone XStreaming engine
        run: |
          git clone https://github.com/Geocld/XStreaming.git xbox-game-engine
          cd xbox-game-engine
          git checkout 9d7649d477b71a674ab72842e950e977e60baedb

      - name: Rebrand and force device-code login
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # App name
          p = Path('xbox-game-engine/android/app/src/main/res/values/strings.xml')
          p.write_text(p.read_text().replace('>XStreaming<','>Xbox Controle Game<'))

          # New package id avoids Android signature conflict with v2.0.0
          g = Path('xbox-game-engine/android/app/build.gradle')
          s = g.read_text()
          s = s.replace('applicationId "com.dev.xstreaming"','applicationId "com.jonathan.xboxcontrole.game201"')
          s = s.replace('signingConfig signingConfigs.release','signingConfig signingConfigs.debug')
          needle = 'return "darwin-x86_64"'
          replacement = 'return System.getProperty("os.name").toLowerCase().contains("linux") ? "linux-x86_64" : "darwin-x86_64"'
          if needle not in s:
              raise SystemExit('NDK host fallback not found')
          s = s.replace(needle, replacement, 1)
          g.write_text(s)

          # Force MSAL/device-code authentication by default.
          # This bypasses the embedded Microsoft account lookup page that rejects some aliases.
          settings = Path('xbox-game-engine/src/store/settingStore.ts')
          st = settings.read_text()
          old = '  use_msal_login: false,'
          if old not in st:
              raise SystemExit('use_msal_login default not found')
          st = st.replace(old, '  use_msal_login: true,', 1)
          settings.write_text(st)

          # Also force the setting on startup so stale local settings cannot send the user
          # back to the broken embedded XAL sign-in screen.
          home = Path('xbox-game-engine/src/pages/Home.tsx')
          hs = home.read_text()
          old_home = "    const _settings = getSettings();\n"
          new_home = "    const _settings = getSettings();\n    _settings.use_msal_login = true;\n    saveSettings(_settings);\n"
          if old_home not in hs:
              raise SystemExit('Home settings initialization not found')
          hs = hs.replace(old_home, new_home, 1)
          home.write_text(hs)

          assets = Path('xbox-game-engine/android/app/src/main/assets')
          assets.mkdir(parents=True, exist_ok=True)
          lic = Path('xbox-game-engine/LICENSE').read_text()
          (assets/'XStreaming-MIT-LICENSE.txt').write_text(lic)

          bad_patch = Path('xbox-game-engine/patches/react-native-paper+5.12.5.patch')
          if bad_patch.exists():
              bad_patch.unlink()
          PY

      - name: Install JS dependencies
        working-directory: xbox-game-engine
        run: |
          corepack enable
          yarn install --immutable

      - name: Build standalone ARM64 APK
        working-directory: xbox-game-engine/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/23.1.7779620
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDevRelease -PreactNativeArchitectures=arm64-v8a

      - name: Locate and collect APK
        run: |
          APK=$(find xbox-game-engine/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "Built APK: $APK"
          cp "$APK" Xbox-Controle-Game-v2.0.1.apk
          ls -lh Xbox-Controle-Game-v2.0.1.apk
          sha256sum Xbox-Controle-Game-v2.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xbox-Controle-Game-v2.0.1
          path: Xbox-Controle-Game-v2.0.1.apk
          if-no-files-found: error
