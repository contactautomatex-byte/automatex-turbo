name: Build Xbox Controle Game APK

on:
  push:
    branches:
      - chatgpt/xbox-remote-apk
    paths:
      - '.github/workflows/chatgpt-xbox-gamepad-remoteplay.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;23.1.7779620'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Clone XStreaming engine
        run: |
          git clone https://github.com/Geocld/XStreaming.git xbox-game-engine
          cd xbox-game-engine
          git checkout 9d7649d477b71a674ab72842e950e977e60baedb

      - name: Rebrand and keep MIT notice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('xbox-game-engine/android/app/src/main/res/values/strings.xml')
          p.write_text(p.read_text().replace('>XStreaming<','>Xbox Controle Game<'))
          g = Path('xbox-game-engine/android/app/build.gradle')
          s = g.read_text()
          s = s.replace('applicationId "com.dev.xstreaming"','applicationId "com.jonathan.xboxcontrole.game"')
          s = s.replace('signingConfig signingConfigs.release','signingConfig signingConfigs.debug')
          g.write_text(s)
          assets = Path('xbox-game-engine/android/app/src/main/assets')
          assets.mkdir(parents=True, exist_ok=True)
          lic = Path('xbox-game-engine/LICENSE').read_text()
          (assets/'XStreaming-MIT-LICENSE.txt').write_text(lic)
          PY

      - name: Install JS dependencies
        working-directory: xbox-game-engine
        run: |
          corepack enable
          yarn install --immutable

      - name: Build standalone ARM64 APK
        working-directory: xbox-game-engine/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/23.1.7779620
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDevRelease -PreactNativeArchitectures=arm64-v8a

      - name: Collect APK
        run: |
          cp xbox-game-engine/android/app/build/outputs/apk/dev/release/app-dev-release.apk Xbox-Controle-Game-v2.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xbox-Controle-Game-v2.0.0
          path: Xbox-Controle-Game-v2.0.0.apk
          if-no-files-found: error
