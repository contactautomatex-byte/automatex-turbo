name: Build Xbox Controle APK

on:
  push:
    branches:
      - chatgpt/xbox-remote-apk
    paths:
      - 'xbox-remote-android/**'
      - '.github/workflows/chatgpt-xbox-remote-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: xbox-remote-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp xbox-remote-android/app/build/outputs/apk/debug/app-debug.apk Xbox-Controle-v1.0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xbox-Controle-v1.0.2
          path: Xbox-Controle-v1.0.2.apk
          if-no-files-found: error
