plugins { id 'com.android.application' }

android {
    namespace 'com.jonathan.xboxremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jonathan.xboxremote.v2'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
